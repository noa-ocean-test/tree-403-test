name: "Deploy"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://example.com/staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying ${GITHUB_SHA} to staging"
          echo "github deployment ok"
          echo "workflow refresh 2026-10-29"

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://example.com/production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "Deploying ${GITHUB_SHA} to production"
          echo "github production deployment ok"
          echo "workflow refresh 2026-10-29"

  deploy-canary:
    name: Deploy canary
    needs: deploy-production
    runs-on: ubuntu-latest
    environment:
      name: canary
      url: https://example.com/canary
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to canary
        run: |
          echo "Deploying ${GITHUB_SHA} to canary"
          echo "github canary deployment ok"
          echo "workflow refresh 2026-10-29"
