stages:
  - validate
  - verify
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

validate:syntax:
  stage: validate
  image: alpine:3.20
  script:
    - echo "validate ok"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

verify:layout:
  stage: verify
  image: alpine:3.20
  needs:
    - validate:syntax
  script:
    - test -f .gitlab-ci.yml
    - echo "layout ok"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

deploy:staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - verify:layout
  environment:
    name: staging
    url: https://example.com/staging
  script:
    - echo "Deploying $CI_COMMIT_SHA to staging"
    - echo "deployment ok"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
