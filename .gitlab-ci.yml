stages:
  - validate
  - verify
  - deploy

validate_syntax:
  stage: validate
  image: alpine:3.20
  script:
    - echo "validate ok"

verify_layout:
  stage: verify
  image: alpine:3.20
  needs:
    - validate_syntax
  script:
    - test -f .gitlab-ci.yml
    - echo "layout ok"

deploy_staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - verify_layout
  environment:
    name: staging
    url: https://example.com/staging
  script:
    - echo "Deploying $CI_COMMIT_SHA to staging"
    - echo "deployment ok"
    - echo "trigger after identity verification"
    - echo "refresh 2026-10-19T18:25"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
