stages:
  - validate
  - verify
  - deploy

validate_syntax:
  stage: validate
  image: alpine:3.20
  script:
    - echo "validate ok"

verify_layout:
  stage: verify
  image: alpine:3.20
  needs:
    - validate_syntax
  script:
    - test -f .gitlab-ci.yml
    - echo "layout ok"

deploy_staging:
  stage: deploy
  image: alpine:3.20
  needs:
    - verify_layout
  environment:
    name: staging
    url: https://example.com/staging
  script:
    - echo "Deploying $CI_COMMIT_SHA to staging"
    - echo "deployment ok"
    - echo "trigger after identity verification"
    - echo "refresh 2026-10-20 round 2 scopes"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - deploy_staging
  environment:
    name: production
    url: https://example.com/production
  script:
    - echo "Deploying $CI_COMMIT_SHA to production"
    - echo "production deployment ok"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_canary:
  stage: deploy
  image: alpine:3.20
  needs:
    - deploy_production
  environment:
    name: canary
    url: https://example.com/canary
  script:
    - echo "Deploying $CI_COMMIT_SHA to canary"
    - echo "canary deployment ok"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
